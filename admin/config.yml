backend:
  name: github
  # TODO: replace with the actual GitHub "owner/repo" this site lives in,
  # e.g. uawlocal647/uaw647-website
  repo: OWNER/REPO
  branch: main
  # TODO: required because GitHub Pages has no server of its own to complete
  # GitHub's OAuth login. Point this at your OAuth proxy's URL once it's
  # deployed (see the setup notes that came with this file). Example:
  # base_url: https://your-oauth-proxy.workers.dev
  base_url: https://REPLACE-WITH-YOUR-OAUTH-PROXY-URL

# Where uploaded officer photos are stored in the repo, and the path used
# to reference them on the live site. Matches the site's plain relative-path
# convention (see assets/img/uaw-logo.png usage elsewhere).
media_folder: "assets/img/officers"
public_folder: "assets/img/officers"

collections:
  - name: "officers"
    label: "Executive Board"
    files:
      - name: "officers"
        label: "Executive Board Officers"
        file: "_data/officers.yml"
        description: "Update each officer's name and photo. Role titles (President, Vice President, etc.) are fixed in the site's code and aren't editable here. Leave Name blank to show \"TBD\"; leave Photo blank to show placeholder initials."
        fields:
          - label: "President"
            name: "president"
            widget: "object"
            collapsed: true
            fields:
              - {label: "Name", name: "name", widget: "string", required: false}
              - {label: "Photo", name: "photo", widget: "image", required: false}
          - label: "Vice President"
            name: "vice_president"
            widget: "object"
            collapsed: true
            fields:
              - {label: "Name", name: "name", widget: "string", required: false}
              - {label: "Photo", name: "photo", widget: "image", required: false}
          - label: "Financial Secretary"
            name: "financial_secretary"
            widget: "object"
            collapsed: true
            fields:
              - {label: "Name", name: "name", widget: "string", required: false}
              - {label: "Photo", name: "photo", widget: "image", required: false}
          - label: "Recording Secretary"
            name: "recording_secretary"
            widget: "object"
            collapsed: true
            fields:
              - {label: "Name", name: "name", widget: "string", required: false}
              - {label: "Photo", name: "photo", widget: "image", required: false}
          - label: "Trustee (1)"
            name: "trustee_1"
            widget: "object"
            collapsed: true
            fields:
              - {label: "Name", name: "name", widget: "string", required: false}
              - {label: "Photo", name: "photo", widget: "image", required: false}
          - label: "Trustee (2)"
            name: "trustee_2"
            widget: "object"
            collapsed: true
            fields:
              - {label: "Name", name: "name", widget: "string", required: false}
              - {label: "Photo", name: "photo", widget: "image", required: false}
          - label: "Sergeant-at-Arms"
            name: "sergeant_at_arms"
            widget: "object"
            collapsed: true
            fields:
              - {label: "Name", name: "name", widget: "string", required: false}
              - {label: "Photo", name: "photo", widget: "image", required: false}
          - label: "Guide"
            name: "guide"
            widget: "object"
            collapsed: true
            fields:
              - {label: "Name", name: "name", widget: "string", required: false}
              - {label: "Photo", name: "photo", widget: "image", required: false}

  - name: "committees"
    label: "Standing Committees"
    files:
      - name: "committee_chairs"
        label: "Committee Chairs"
        file: "_data/committee_chairs.yml"
        description: "Update the current chair's name for each committee. Committee names and the \"Chair:\" label are fixed in the site's code and aren't editable here. Leave a field blank to show \"TBD\"."
        fields:
          - {label: "Constitution and Bylaws — Chair", name: "constitution-bylaws", widget: "string", required: false}
          - {label: "Union Label — Chair", name: "union-label", widget: "string", required: false}
          - {label: "Education — Chair", name: "education", widget: "string", required: false}
          - {label: "Conservation and Recreation — Chair", name: "conservation-recreation", widget: "string", required: false}
          - {label: "Community Services — Chair", name: "community-services", widget: "string", required: false}
          - {label: "Civil and Human Rights — Chair", name: "civil-human-rights", widget: "string", required: false}
          - {label: "Citizenship and Legislative (CAP) — Chair", name: "citizenship-legislative", widget: "string", required: false}
          - {label: "Consumer Affairs — Chair", name: "consumer-affairs", widget: "string", required: false}
          - {label: "Organizing — Chair", name: "organizing", widget: "string", required: false}
          - {label: "Local Union Communication (UAW-LUCA) — Chair", name: "luca", widget: "string", required: false}
          - {label: "Veterans — Chair", name: "veterans", widget: "string", required: false}
          - {label: "Women's — Chair", name: "womens", widget: "string", required: false}
