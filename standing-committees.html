---
layout: default
title: Standing Committees
---

<section class="page-hero" style="padding-bottom:56px;">
  <div class="wrap">
    <div class="eyebrow">Leadership</div>
    <h1>Standing Committees</h1>
  </div>
</section>

<section>
  <div class="wrap content-page">
    <div class="committee-grid" style="margin-top:8px;">
      {% for c in site.data.committees %}
        {% assign chair = site.data.committee_chairs[c.key] %}
        <div class="committee-card">
          <h3><a href="{{ c.url }}" target="_blank" rel="noopener">{{ c.name }}</a></h3>
          <p>Chair: {% if chair and chair != "" %}{{ chair }}{% else %}TBD{% endif %}</p>
        </div>
      {% endfor %}
    </div>
  </div>
</section>
